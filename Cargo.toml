[package]
name = "cyclotrace"
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yua134/cyclotrace"
readme = "README.md"
authors = ["yua"]
exclude = ["/.history/**", "/.github/**", "notice.hbs"]
keywords = ["wait-free", "lock-free", "ring-buffer", "spmc"]
categories = ["concurrency", "data-structures", "no-std::no-alloc", "multimedia::audio", "science::robotics"]
description = "A high-performance, wait-free ring buffer in Rust. Supports SPMC with peek-based semantics instead of destructive consumption."

[features]
default = ["alloc"]
alloc = []
portable-atomic = ["dep:portable-atomic", "condtype"]
loom = ["dep:loom", "alloc"]
arrayvec = ["dep:arrayvec"]
heapless = ["dep:heapless"]

[dependencies]
cfg-if = "1"
crossbeam-utils = { version = "0.8" , default-features = false}
bytemuck = "1"
portable-atomic = { version = "1", optional = true }
condtype = { version = "1", optional = true }

loom = { version = "0.7.2" , optional = true }

heapless = { version = "0.9", optional = true }
arrayvec = { version = "0.7", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.8.2"
spmc_buffer = "0.5.2"
ringcast = "0.1.1"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[[bench]]
name = "basic"
harness = false

[profile]
release.opt-level = 3
release.panic = "abort"
release.strip = true
