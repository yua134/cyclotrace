name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.test_type }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test_type: standard
          - os: macos-latest
            test_type: standard
          - os: windows-latest
            test_type: standard
          - os: ubuntu-latest
            test_type: loom

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.test_type }}

      - name: Run Standard Tests
        if: matrix.test_type == 'standard'
        run: cargo test --features alloc,arrayvec,heapless --verbose --locked

      - name: Run Loom Tests
        if: matrix.test_type == 'loom'
        run: cargo test --features loom --verbose --locked

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: static-analysis

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rustfmt
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --no-default-features

  miri:
    name: Miri
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: swatinem/rust-cache@v2
        with:
          key: miri

      - name: Run Miri
        run: cargo miri test --features alloc,arrayvec,heapless --verbose --locked
